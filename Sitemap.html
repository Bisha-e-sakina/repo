    <nav></nav>
    <style>
        *{
font-family: 'Times New Roman', Times, serif;
}


body {
 background-color: #bebecf;
 color: #eaeaea;

}
.flow-container {
 text-align: center;
 margin-top: 60%;
}
.node {
 display: inline-block;
 margin-top: 300px;
 padding: 15px 30px;
 margin: 10px;
 background-color: goldenrod;
 border-radius: 10px;
 color: #eaeaea;
 font-weight: bold;
 box-shadow: 0 4px 10px rgba(0, 0, 0, 0.8);
 transition: transform 0.3s ease;
 cursor: pointer;
}
.node:hover {
 transform: scale(1.1);
 background-color: #16213e;
}
.connector {
 width: 2px;
 height: 60px;
 background-color: #eaeaea;
 margin: 0 auto;
}
.branch {
 display: flex;
 justify-content: center;
 gap: 20px;
 margin-top: 10px;
}

</style>
</head>

<body>
<nav></nav>
<div class="flow-container mt-5">
<div class="node mt-5">Home Page</div>
<div class="connector"></div>
<div class="branch">

 <div class="node">Events</div>
 <div class="node">Categories</div>
 <div class="node">Gallery</div>

</div>

</div>
<div class="connector mt-3"></div>
<div class="branch">
